[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

# Script deploy membaca config/cars.json (hasil `pnpm config:export`) dan menulis alamat + ABI
# ke packages/config/deployments. ./out dibaca untuk mengambil ABI.
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "../packages/config/deployments" },
]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[fmt]
line_length = 120

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
