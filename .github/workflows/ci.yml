name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # packages/config, packages/sim, backend, dan frontend (kalau sudah ada package.json-nya).
  workspace:
    name: Typecheck, test, build (pnpm workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # versi diambil dari "packageManager" di package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test (termasuk golden test sim)
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm -r --if-present build

      - name: contract/config/cars.json sinkron dengan packages/config
        run: |
          pnpm config:export
          git diff --exit-code -- contract/config/cars.json \
            || (echo "::error::cars.json tidak sinkron. Jalankan 'pnpm config:export' lalu commit hasilnya." && exit 1)

      - name: Golden fixture sinkron dengan sim
        run: |
          pnpm --filter @racing-gang/sim fixtures
          git diff --exit-code -- packages/sim/fixtures \
            || (echo "::error::Golden fixture berubah. Jalankan 'pnpm --filter @racing-gang/sim fixtures', review diff-nya, lalu commit." && exit 1)

  # Foundry (Bayu). Dilewati otomatis sampai contract/foundry.toml ada.
  contracts:
    name: Forge fmt, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - id: detect
        working-directory: .
        run: |
          if [ -f contract/foundry.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "Belum ada contract/foundry.toml, job dilewati."; fi

      - if: steps.detect.outputs.found == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - if: steps.detect.outputs.found == 'true'
        name: forge fmt --check
        run: forge fmt --check

      - if: steps.detect.outputs.found == 'true'
        name: forge build
        run: forge build --sizes

      - if: steps.detect.outputs.found == 'true'
        name: forge test
        run: forge test -vvv

  # Docker image backend (BACKEND_PLAN L). Dilewati otomatis sampai backend/Dockerfile ada.
  backend-docker:
    name: Docker build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workspace
    steps:
      - uses: actions/checkout@v7

      - id: detect
        run: |
          if [ -f backend/Dockerfile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "Belum ada backend/Dockerfile, job dilewati."; fi

      - if: steps.detect.outputs.found == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.detect.outputs.found == 'true'
        name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: racing-gang-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: steps.detect.outputs.found == 'true'
        name: Smoke test container (/health, /config, migrasi DB di volume)
        run: |
          docker run -d --name rg -p 8080:8080 \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e PUBLIC_ORIGIN=http://localhost:5173 \
            -e CHAIN_ID=10143 \
            -e PRIVY_APP_ID=ci-app \
            -e PRIVY_VERIFICATION_KEY=ci-key \
            -e PRIVY_APP_SECRET=ci-secret \
            -v rg-data:/data \
            racing-gang-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/config | grep -q '"configVersion"'
          docker exec rg ls -la /data
          docker exec rg test -f /data/racing-gang.db

      - if: always() && steps.detect.outputs.found == 'true'
        name: Log container
        run: docker logs rg || true
